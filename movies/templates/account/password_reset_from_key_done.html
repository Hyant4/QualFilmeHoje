{% extends "account/base_entrance.html" %}
{% block head_title %}Senha alterada{% endblock %}
{% block content %}
  <section class="auth-card auth-confirm" aria-labelledby="password-changed-title">
    <div class="auth-confirm-icon" aria-hidden="true">✓</div>
    <div class="auth-card-head">
      <p class="eyebrow">Tudo certo</p>
      <h2 id="password-changed-title">Senha alterada</h2>
      <p>Sua nova senha já está ativa. Agora você pode entrar normalmente.</p>
    </div>
    <a href="{% url 'account_login' %}" class="auth-submit auth-submit-link">Entrar na conta <span aria-hidden="true">→</span></a>
  </section>
{% endblock %}
